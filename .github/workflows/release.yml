name: Publicar versão do Bento

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Criar build assinado e manifesto de atualização
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $versao = $env:GITHUB_REF_NAME -replace '^v', ''
          pnpm lancar $versao "Atualização do Bento"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar release para o atualizador
        uses: softprops/action-gh-release@v2
        with:
          name: Bento ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/Bento_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/Bento_*_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
